[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-paper-translator"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["requests>=2.32,<3", "pypdf>=5,<7", "regex>=2024.11", "fonttools>=4.59,<5"]

[project.scripts]
arxiv-translate = "paper_translate.cli:main"
arxiv-translate-ui = "paper_translate.web:main"

[tool.setuptools]
packages = ["paper_translate"]

[tool.setuptools.package-data]
paper_translate = ["web.html"]
